<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Login</title>
    <!-- Memuat Tailwind CSS dari CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mengatur font Inter sebagai default -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6; /* Warna latar belakang terang */
      }
      /* Custom style untuk efek bayangan yang lebih halus */
      .card-shadow {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 5px 10px -5px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen p-4">
    <!-- Kontainer Kartu Login Utama -->
    <div
      class="w-full max-w-md bg-white rounded-xl p-8 card-shadow transition-all duration-300 hover:shadow-lg"
    >
      <!-- Header/Judul -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
          Selamat Datang Kembali
        </h1>
        <p class="mt-2 text-sm text-gray-500">Silakan masuk ke akun Anda.</p>
      </div>

      <!-- Formulir Login -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Input Email -->
        <div class="mb-5">
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
            placeholder="nama@contoh.com"
          />
        </div>

        <!-- Input Kata Sandi -->
        <div class="mb-6">
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Kata Sandi
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
            placeholder="••••••••"
          />
          <div class="text-right mt-2">
            <a
              href="#"
              class="text-sm font-medium text-blue-600 hover:text-blue-500 transition duration-150"
            >
              Lupa Kata Sandi?
            </a>
          </div>
        </div>

        <!-- Pesan Status/Error (Hidden by default) -->
        <div
          id="statusMessage"
          class="hidden p-3 mb-4 text-sm rounded-lg"
          role="alert"
        >
          <!-- Pesan akan diisi oleh JavaScript -->
        </div>

        <!-- Tombol Login -->
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 ease-in-out transform hover:scale-[1.01]"
          >
            Masuk
          </button>
        </div>
      </form>

      <!-- Footer / Link Pendaftaran -->
      <div class="mt-6 text-center text-sm text-gray-600">
        Belum punya akun?
        <a
          href="#"
          class="font-medium text-blue-600 hover:text-blue-500 transition duration-150"
        >
          Daftar Sekarang
        </a>
      </div>
    </div>

    <script>
      /**
       * Fungsi untuk menampilkan pesan status (sukses atau error)
       * @param {string} message - Pesan yang akan ditampilkan.
       * @param {string} type - Tipe pesan: 'success' atau 'error'.
       */
      function showStatus(message, type) {
        const statusBox = document.getElementById("statusMessage");
        statusBox.textContent = message;

        // Hapus semua kelas warna yang ada
        statusBox.classList.remove(
          "bg-red-100",
          "text-red-700",
          "bg-green-100",
          "text-green-700",
          "hidden"
        );

        if (type === "success") {
          statusBox.classList.add("bg-green-100", "text-green-700");
        } else if (type === "error") {
          statusBox.classList.add("bg-red-100", "text-red-700");
        }

        // Sembunyikan pesan setelah 4 detik
        setTimeout(() => {
          statusBox.classList.add("hidden");
        }, 4000);
      }

      /**
       * Fungsi yang menangani proses login saat form disubmit
       */
      function handleLogin(event) {
        // Mencegah pengiriman form default
        event.preventDefault();

        // Ambil nilai dari input
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        // Skenario simulasi login
        if (email === "test@contoh.com" && password === "password123") {
          showStatus("Login Berhasil! Mengalihkan...", "success");
          // Di aplikasi nyata: arahkan pengguna ke dashboard: window.location.href = '/dashboard';
        } else if (email === "" || password === "") {
          showStatus("Email dan kata sandi tidak boleh kosong.", "error");
        } else {
          showStatus(
            "Kombinasi email dan kata sandi salah. Silakan coba lagi.",
            "error"
          );
        }
      }
    </script>
  </body>
</html>
